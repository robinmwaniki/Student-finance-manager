# Render staging only. This Blueprint never provisions production resources.
services:
  - type: web
    name: student-finance-manager-staging
    runtime: docker
    plan: free
    region: singapore
    branch: develop
    autoDeployTrigger: "off"
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Student Finance Manager Staging
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_TIMEZONE
        value: Africa/Nairobi
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: student-finance-manager-staging-db
          property: connectionString
      - key: RUN_MIGRATIONS
        value: "true"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_ENCRYPT
        value: "true"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: database
      - key: MAIL_MAILER
        value: log
      - key: FILESYSTEM_DISK
        value: local

databases:
  - name: student-finance-manager-staging-db
    databaseName: student_finance_staging
    user: student_finance_staging
    plan: free
    region: singapore
    postgresMajorVersion: "18"
