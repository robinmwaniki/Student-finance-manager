name: Gemini PR Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    # Skip automated dependency update PRs if desired
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract PR Diff
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr diff "$PR_NUMBER" > pr_changes.diff

      - name: Run Gemini Code Review
        id: gemini_review
        uses: google-github-actions/run-gemini-cli@main
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            You are an expert senior software engineer conducting a pull request code review.
            Analyze the git diff located in the file `pr_changes.diff`.
            
            Focus your review on:
            1. Potential bugs, edge cases, or null/index handling errors.
            2. Security vulnerabilities (e.g., hardcoded secrets, injection risks, improper auth checks).
            3. Performance bottlenecks or inefficient database queries.
            4. Readability, maintainability, and adherence to clean code practices.
            
            Format your response in clean Markdown with bullet points. If the code looks solid with no major issues, state that clearly and briefly highlight what was done well. Keep feedback constructive and actionable.

      - name: Post Review Comment on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_BODY: ${{ steps.gemini_review.outputs.response }}
        run: |
          if [ -n "$REVIEW_BODY" ]; then
            gh pr comment "$PR_NUMBER" --body "## 🤖 Gemini AI Code Review

          $REVIEW_BODY"
          else
            echo "No review output generated."
          fi
