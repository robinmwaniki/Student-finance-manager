name: Generate Composer Lock File

on:
  push:
    branches:
      - feature/composer-lock-generation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: composer-lock-generation
  cancel-in-progress: false

jobs:
  generate-lock:
    name: Resolve and validate PHP dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP 8.5 and Composer 2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, curl, dom, fileinfo, filter, hash, mbstring, openssl, pcre, pdo, pdo_pgsql, session, tokenizer, xml
          coverage: none
          tools: composer:v2

      - name: Resolve dependencies and generate lock file
        run: composer update --no-interaction --prefer-dist --no-progress --with-all-dependencies

      - name: Validate manifest and lock file
        run: |
          set -euo pipefail
          test -s composer.lock
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress

      - name: Publish lock file artifact for review
        uses: actions/upload-artifact@v4
        with:
          name: composer-lock-file
          path: composer.lock
          if-no-files-found: error
          retention-days: 2
