name: Generate Composer Lock File

on:
  push:
    branches:
      - feature/composer-lock-generation
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: composer-lock-generation
  cancel-in-progress: false

jobs:
  generate-lock:
    name: Resolve, validate and publish locked PHP dependencies
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: student_finance_test
          POSTGRES_USER: student_finance
          POSTGRES_PASSWORD: student_finance_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U student_finance -d student_finance_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up PHP 8.5 and Composer 2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, curl, dom, fileinfo, filter, hash, mbstring, openssl, pcre, pdo, pdo_pgsql, session, tokenizer, xml
          coverage: none
          tools: composer:v2

      - name: Resolve dependencies and generate lock file
        run: composer update --no-interaction --prefer-dist --no-progress --with-all-dependencies

      - name: Validate manifest and install from lock file
        run: |
          set -euo pipefail
          test -s composer.lock
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: student_finance_test
          DB_USERNAME: student_finance
          DB_PASSWORD: student_finance_test_password

      - name: Run PostgreSQL migrations
        run: php artisan migrate --force
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: student_finance_test
          DB_USERNAME: student_finance
          DB_PASSWORD: student_finance_test_password

      - name: Run automated tests
        run: php artisan test
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: student_finance_test
          DB_USERNAME: student_finance
          DB_PASSWORD: student_finance_test_password

      - name: Create lock-file PR and dispatch CI
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: \${{ github.run_number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if git diff --cached --quiet; then
            echo "No composer.lock changes were generated."
            exit 0
          fi

          BRANCH_NAME="feature/composer-lock-$RUN_NUMBER"
          git checkout -b "$BRANCH_NAME"
          git commit -m "build(deps): commit Composer lock file"
          git push origin "$BRANCH_NAME"

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base develop \
            --head "$BRANCH_NAME" \
            --title "build(deps): commit Composer lock file" \
            --body "## Summary
          Commits composer.lock generated by Composer 2 using PHP 8.5.

          ## Validation
          - composer update completed successfully.
          - composer validate --strict passed.
          - composer install completed using the generated lock file.
          - PostgreSQL 18 migrations passed.
          - The Laravel PHPUnit suite passed.

          Laravel CI is dispatched against this branch after PR creation."

          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH_NAME"
