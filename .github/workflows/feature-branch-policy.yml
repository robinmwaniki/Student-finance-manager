name: Feature branch policy

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - develop
      - main
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions:
  contents: read

jobs:
  validate-branch-name:
    name: Enforce feature/* development branches
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch naming convention
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BRANCH: ${{ github.ref_name }}
          PR_SOURCE_BRANCH: ${{ github.head_ref }}
          PR_TARGET_BRANCH: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$PR_TARGET_BRANCH" == "main" && "$PR_SOURCE_BRANCH" == "develop" ]]; then
              echo "Accepted release promotion: develop -> main"
              exit 0
            fi

            if [[ "$PR_TARGET_BRANCH" == "develop" && "$PR_SOURCE_BRANCH" =~ ^feature/[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
              echo "Accepted feature branch: $PR_SOURCE_BRANCH -> develop"
              exit 0
            fi

            echo "::error::Pull requests must use feature/<name> -> develop, or develop -> main for releases."
            exit 1
          fi

          if [[ "$PUSH_BRANCH" == "main" || "$PUSH_BRANCH" == "develop" ]]; then
            echo "Accepted protected integration branch: $PUSH_BRANCH"
            exit 0
          fi

          if [[ "$PUSH_BRANCH" =~ ^feature/[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
            echo "Accepted development branch: $PUSH_BRANCH"
            exit 0
          fi

          echo "::error::Use feature/<descriptive-name> for development branches."
          echo "Example: feature/dashboard-redesign"
          exit 1
