name: Laravel CI

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: laravel-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP 8.5, PostgreSQL 18 and Laravel tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: student_finance_test
          POSTGRES_USER: student_finance
          POSTGRES_PASSWORD: student_finance_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U student_finance -d student_finance_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, curl, dom, fileinfo, filter, hash, mbstring, openssl, pcre, pdo, pdo_pgsql, session, tokenizer, xml
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate Composer manifest and lock file
        run: composer validate --strict

      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: student_finance_test
          DB_USERNAME: student_finance
          DB_PASSWORD: student_finance_test_password

      - name: Run Laravel migrations
        run: php artisan migrate --force
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: student_finance_test
          DB_USERNAME: student_finance
          DB_PASSWORD: student_finance_test_password

      - name: Run automated tests
        run: php artisan test
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: student_finance_test
          DB_USERNAME: student_finance
          DB_PASSWORD: student_finance_test_password

      - name: Check code style
        run: vendor/bin/pint --test
