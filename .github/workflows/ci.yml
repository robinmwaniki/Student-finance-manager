name: Laravel CI

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laravel-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP 8.5, PostgreSQL 18 and Laravel tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: student_finance_test
          POSTGRES_USER: student_finance
          POSTGRES_PASSWORD: student_finance_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U student_finance -d student_finance_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, curl, dom, fileinfo, filter, hash, mbstring, openssl, pcre, pdo, pdo_pgsql, session, tokenizer, xml
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate Composer manifest and generated lock file
        run: composer validate --strict

      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: student_finance_test
          DB_USERNAME: student_finance
          DB_PASSWORD: student_finance_test_password

      - name: Run Laravel migrations
        run: php artisan migrate --force
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: student_finance_test
          DB_USERNAME: student_finance
          DB_PASSWORD: student_finance_test_password

      - name: Run automated tests
        run: php artisan test
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: student_finance_test
          DB_USERNAME: student_finance
          DB_PASSWORD: student_finance_test_password

      - name: Set up Node.js for browser policy tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run browser payload policy tests
        run: node --test tests/JavaScript/*.test.cjs

      - name: Check Pint formatting on changed PHP files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
          else
            BASE_SHA="$PUSH_BASE_SHA"
          fi

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          if [[ -z "$BASE_SHA" ]]; then
            echo "::error::Unable to determine the base commit for the Pint diff."
            exit 1
          fi

          mapfile -t PHP_FILES < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA"...HEAD -- '*.php' |
              grep -E '^(app|bootstrap|config|database|public|routes|tests)/' || true
          )

          if (( ${#PHP_FILES[@]} == 0 )); then
            echo "No changed application PHP files to format-check."
          else
            printf 'Checking %s changed PHP file(s) with Pint.\n' "${#PHP_FILES[@]}"
            vendor/bin/pint --test "${PHP_FILES[@]}"
          fi

      - name: Build Render staging Docker image
        run: docker build --pull --tag student-finance-manager:ci .
