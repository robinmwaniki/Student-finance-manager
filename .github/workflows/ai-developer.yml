name: AI Developer & Bug Fixer

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      task_description:
        description: 'Describe the bug to fix or feature to build:'
        required: true
        type: string

jobs:
  ai-code-generation:
    # Trigger only when an issue is labeled 'ai-fix' or when run manually
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ai-fix'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git Identity
        run: |
          git config --global user.name "gemini-ai-bot[bot]"
          git config --global user.email "gemini-ai-bot@users.noreply.github.com"

      - name: Gather Codebase Context
        run: |
          echo "=== PROJECT STRUCTURE ===" > project_context.txt
          find . -maxdepth 3 -not -path '*/.*' -not -path './target*' -not -path './node_modules*' >> project_context.txt

      - name: Run Gemini Code Generator
        id: gemini_gen
        uses: google-github-actions/run-gemini-cli@main
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            You are an expert software engineer and backend developer. 
            You have access to the project file structure below and need to implement a bug fix or feature upgrade.

            TASK DESCRIPTION:
            ${{ github.event.inputs.task_description || github.event.issue.body }}

            PROJECT STRUCTURE:
            $(cat project_context.txt)

            Instructions:
            1. Analyze what files need to be created or modified.
            2. Provide the complete, updated source code for any file you modify.
            3. Format each file change clearly using markdown blocks with the exact file path as a header (e.g., `### path/to/file.java`).
            4. Write clean, production-ready code with proper error handling and dependency integration.

      - name: Apply Changes and Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_RESPONSE: ${{ steps.gemini_gen.outputs.response }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # Create a unique branch for the AI task
          BRANCH_NAME="ai-fix-patch-${{ github.run_id }}"
          git checkout -b "$BRANCH_NAME"

          # Save AI response to a log file for debugging/parsing
          echo "$AI_RESPONSE" > ai_instructions.md

          echo "AI generated instructions successfully. Reviewing branch changes..."
          
          # Push the branch and open a PR via GitHub CLI
          git push origin "$BRANCH_NAME"

          if [ -n "$ISSUE_NUMBER" ]; then
            gh pr create --title "🤖 AI Fix for Issue #$ISSUE_NUMBER" \
                         --body "Automated code changes generated by Gemini based on Issue #$ISSUE_NUMBER.\n\n### AI Implementation Details:\n$AI_RESPONSE" \
                         --base main \
                         --head "$BRANCH_NAME"
          else
            gh pr create --title "🤖 AI Developer Task Implementation" \
                         --body "Automated changes generated via manual workflow dispatch.\n\n### Details:\n$AI_RESPONSE" \
                         --base main \
                         --head "$BRANCH_NAME"
          fi
